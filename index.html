<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Météo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
      <div class="card">
        <div class="weather">
          <div class="left">
            <h1 id="cityElement"></h1>
            <div class="time">
              <p>Dernière mise à jour :</p>
              <p id="timeElement"></p>
            </div>
          </div>

          <div class="statut">
            <img id="iconElement" class="icon" alt="">
            <p id="weatherStateElement"></p>
            <p id="errorElement"></p>
            <div class="temperature">
              <p id="temperatureElement"></p>
            </div>
          </div>

          <div class="right">
            <div class="humidity">
              <p id="humidityElement"></p>  
              <img src="icons/raindrop.svg" class="icon" alt="Humidité">
            </div>
            <div class="wind">
              <p id="windElement"></p>  
              <div id="wind-anim" class="icon"></div>
            </div>
          </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script type="module" src="meteo.js"></script>
</body>
</html>
