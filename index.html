<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Météo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
      <div class="card">
        <div class="weather">
          <div class="left">
            <h1 id="city"></h1>
            <div class="time">
              <p>Dernière mise à jour :</p>
              <p id="time"></p>
            </div>
          </div>

          <div class="statut">
            <img id="icons" class="icon">
            <p id="wcode"></p>
            <div class="temperature">
              <p id="tmp"></p>
            <!--  <img src="icons/thermometer.svg" class="icon" alt="Température"> -->
            </div>
          </div>

          <div class="right">
            <div class="humidity">
              <p id="relhum"></p>  
              <img src="icons/raindrop.svg" class="icon" alt="Humidité">
            </div>
            <div class="wind">
              <p id="wind"></p>  
              <img src="icons/wind.svg" class="icon" alt="Vitesse du vent">
            </div>
          </div>
        </div>
    </div>
    <script src="meteo.js"></script>
</body>
</html>
